<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8 text-center">
            <h2 class="display-5 fw-bold mb-4">Help Shape Archery Shoot Finder</h2>
            <p class="lead mb-5">Whether you're a shooter or venue owner, your input will directly influence the
                app.</p>

            <form action="https://formspree.io/f/mgvnbwwb" method="POST"
                class="row g-3 justify-content-center">
                <div class="col-md-6">
                    <input type="text" name="name" class="form-control form-control-lg" placeholder="Your Name"
                        required>
                </div>
                <div class="col-md-6">
                    <input type="email" name="email" class="form-control form-control-lg" placeholder="Email Address"
                        required>
                </div>
                <div class="col-12">
                    <select name="type" class="form-select form-select-lg" required>
                        <option value="">I am a...</option>
                        <option value="shooter">Shooter / Archer</option>
                        <option value="venue">Venue / Event Organizer</option>
                    </select>
                </div>
                <div class="col-12">
                    <textarea name="feedback" rows="4" class="form-control form-control-lg"
                        placeholder="Your feedback or requested features..."></textarea>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-light btn-lg px-5">Submit Feedback & Join
                        Waitlist</button>
                </div>
            </form>
        </div>
    </div>
</div>
